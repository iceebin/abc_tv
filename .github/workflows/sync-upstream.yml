name: Sync upstream repository

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate upstream configuration
        env:
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
        run: |
          if [ -z "$UPSTREAM_REPOSITORY" ]; then
            echo "::error::Missing repository variable UPSTREAM_REPOSITORY (owner/repo)."
            exit 1
          fi

      - name: Sync default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          if ! printf '%s' "$UPSTREAM_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::UPSTREAM_REPOSITORY must use owner/repo format."
            exit 1
          fi

          if ! git ls-remote --exit-code "https://github.com/${UPSTREAM_REPOSITORY}.git" >/dev/null 2>&1; then
            echo "::error::Cannot access upstream repository: ${UPSTREAM_REPOSITORY}."
            exit 1
          fi

          askpass_file="$workdir/git-askpass.sh"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) echo "x-access-token" ;;' \
            '  *Password*) echo "$GIT_ACCESS_TOKEN" ;;' \
            'esac' > "$askpass_file"
          chmod 700 "$askpass_file"

          export GIT_ASKPASS="$askpass_file"
          export GIT_ACCESS_TOKEN="$GITHUB_TOKEN"
          export GIT_TERMINAL_PROMPT=0

          git -c init.defaultBranch="$TARGET_DEFAULT_BRANCH" clone --no-tags "https://github.com/${TARGET_REPOSITORY}.git" "$workdir/repo"
          cd "$workdir/repo"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "$TARGET_DEFAULT_BRANCH"

          counts="$(git rev-list --left-right --count "$TARGET_DEFAULT_BRANCH...upstream/$TARGET_DEFAULT_BRANCH")"
          local_only="$(printf '%s' "$counts" | awk '{print $1}')"
          upstream_only="$(printf '%s' "$counts" | awk '{print $2}')"

          if [ "$upstream_only" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi

          if [ "$local_only" -ne 0 ]; then
            echo "::error::Default branch has local commits not in upstream. Manual sync is required."
            exit 1
          fi

          git checkout "$TARGET_DEFAULT_BRANCH"
          git merge --ff-only "upstream/$TARGET_DEFAULT_BRANCH"
          git push origin "HEAD:$TARGET_DEFAULT_BRANCH"
